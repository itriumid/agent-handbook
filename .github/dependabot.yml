# Dependabot's security updates are on for this repository; this file sets how their pull
# requests look. `open-pull-requests-limit: 0` turns version updates off, so the only pull
# requests are for vulnerabilities. Raise it to have Dependabot open routine upgrades as well.
#
# `area: tooling` instead of Dependabot's default `dependencies` label: the handbook labels
# pull requests by area, and workflows are this repository's tooling.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: ['area: tooling']
