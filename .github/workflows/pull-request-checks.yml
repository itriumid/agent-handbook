name: Pull Request Checks

# Checks everything derivable from a pull request's own metadata. Both jobs are required status
# checks in the ruleset applied by the handbook's scripts/configure-repository.sh, so they run on
# every push (`synchronize`) as well as on open — a required check attaches to a commit, and a new
# head commit without one would block the merge. See the handbook's
# conventions/background/git-workflow.md.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

# Any `permissions:` block replaces the default token scopes, so grant per job.
permissions: {}

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Check the branch name against the convention
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;

            // Read the head ref from the API rather than context.payload. Renaming a branch
            // retargets its open pull requests but fires no webhook, so re-running this
            // workflow is the only way to clear a red check — and a re-run replays the
            // original payload, in which head.ref is still the old name.
            const { data: freshPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            const branch = freshPullRequest.head.ref;

            // <type>/[<issue>-]<slug>: an issue number, a slug, or both — never neither.
            const pattern = /^(feature|enhancement|fix|chore)\/[a-z0-9]+(-[a-z0-9]+)*$/;
            const exempt =
              branch === 'main' || /^revert-\d+-/.test(branch) || /^dependabot\//.test(branch);
            const passes = exempt || pattern.test(branch);

            const marker = '<!-- branch-name-check -->';
            const convention = '`<feature|enhancement|fix|chore>/[<issue>-]<slug>`';
            const rules =
              'https://github.com/itriumid/agent-handbook/blob/main/conventions/rules/branching.md';
            const body = exempt
              ? `${marker}\n✅ \`${branch}\` is the mainline, a revert or a dependabot branch — exempt from the naming convention.`
              : passes
                ? `${marker}\n✅ Branch name \`${branch}\` follows the convention: ${convention}.`
                : `${marker}\n❌ Branch name \`${branch}\` doesn't match the convention ${convention}.\n\nThe issue number is optional and bare digits — \`fix/31\`, \`fix/null-cart-total\` and \`fix/31-null-cart-total\` are all fine. Lowercase kebab-case only.\n\nSee [the branching rules](${rules}). Rename the branch, then re-run this workflow — it reads the head ref live, so the check clears on the re-run.`;

            // Paginated: a first-page-only lookup would miss the marker on a long thread and
            // post a duplicate.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              }
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

            if (!passes) {
              core.setFailed(`Branch name "${branch}" doesn't match the naming convention.`);
            }

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check commits, title and description for self-attribution
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Enforces "No self-attribution" from the handbook's conventions/rules/ai-agents.md.
            // The pull request title and description are checked too: they become the merge
            // commit's subject and body.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // Filenames and settings directories a tool dictates are not attribution; strip them
            // before matching.
            const allowedFilenames = /\b(CLAUDE|AGENTS|GEMINI)\.md\b|\.(claude|gemini|windsurf)\b[\w./-]*/gi;
            const vendors =
              /\b(claude|anthropic|openai|chatgpt|gpt-?\d|codex|copilot|gemini|windsurf|devin|aider)\b/i;
            const attribution = [
              { pattern: /^co-authored-by:.*(\[bot\]|noreply@(anthropic|openai)\.com)/im, reason: 'a bot co-author trailer' },
              { pattern: /\bgenerated with/i, reason: '"generated with"' },
              { pattern: /🤖/u, reason: 'a robot emoji' },
            ];

            const findings = [];
            const inspect = (where, text) => {
              const cleaned = (text || '').replace(allowedFilenames, '');
              const vendor = cleaned.match(vendors);
              if (vendor) findings.push(`${where}: mentions "${vendor[0]}"`);
              for (const { pattern, reason } of attribution) {
                if (pattern.test(cleaned)) findings.push(`${where}: contains ${reason}`);
              }
            };

            inspect('Pull request title', pr.title);
            inspect('Pull request description', pr.body);
            for (const commit of commits) {
              // Dependabot writes its own messages; they aren't agent output.
              if (commit.author?.login === 'dependabot[bot]') continue;
              inspect(`Commit ${commit.sha.slice(0, 7)}`, commit.commit.message);
            }

            if (findings.length) {
              core.setFailed(
                [
                  'Found tool or vendor attribution, which the handbook forbids in anything kept:',
                  ...findings.map((finding) => `  - ${finding}`),
                  'Reword the commit (rebase, then push with --force-with-lease) or edit the pull request text, then re-run.',
                  'Rules: https://github.com/itriumid/agent-handbook/blob/main/conventions/rules/ai-agents.md',
                ].join('\n'),
              );
            } else {
              core.info(`Checked the title, description and ${commits.length} commit(s): no attribution found.`);
            }

      - name: Check the description and commits are written for a reader who wasn't there
        # Runs even when the attribution step fails, so one push reports both.
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Enforces "Write for a reader who wasn't there" and the three headings from the
            // handbook's conventions/rules/pull-requests.md. The patterns are narrow: each is a reply to
            // the requester or an account of the session, so a description that passes can still break
            // the rule. See conventions/background/git-workflow.md.
            function reviewDescription(body, { isDescription }) {
              const findings = [];
              const text = (body || '').replace(/\r\n/g, '\n').replace(/<!--[\s\S]*?-->/g, '');

              // Fenced blocks open with three or more backticks or tildes and close only on a line of the
              // same character, at least as long, with only whitespace after it. A heading inside one is an example,
              // not a section. The lines between the fences count as content of the section around them, so
              // a command-only How to verify isn't empty; the fence lines themselves don't.
              // A quoted paragraph runs until a blank line or a line that starts a new block: a bullet, a
              // numbered list starting at 1, a heading or a rule. Other lines without a `>` continue it.
              const proseLines = [];
              const sections = {};
              let current = null;
              let fence = null;
              let quoted = false;
              // A line left out of the prose leaves a blank line in its place, so a code span can't
              // reach across a fence, a quote or a heading.
              const skip = () => proseLines.push({ line: '', section: current });
              const rule = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
              const listItem = /^\s*([-*+]|\d+[.)])\s/;
              const countAsContent = (line) => {
                if (current && !/^---\s*$/.test(line) && !/^\s*- \[[ x]\].*(Merging with|label applied)/i.test(line)) {
                  sections[current] += line.trim();
                }
              };
              for (const line of text.split('\n')) {
                if (fence) {
                  const closing = line.match(/^ {0,3}(`+|~+)\s*$/);
                  if (closing && closing[1][0] === fence[0] && closing[1].length >= fence.length) fence = null;
                  else countAsContent(line);
                  skip();
                  continue;
                }
                // A backtick fence's info string can't contain a backtick: ```a``` on one line is inline code.
                const opening = line.match(/^ {0,3}(`{3,}(?=[^`]*$)|~{3,})/);
                if (opening) {
                  fence = opening[1];
                  quoted = false;
                  skip();
                  continue;
                }
                const heading = line.match(/^##\s+(.+?)\s*$/);
                if (heading) {
                  current = heading[1];
                  sections[current] = '';
                  quoted = false;
                  skip();
                  proseLines.push({ line, section: current });
                  skip();
                  continue;
                }
                countAsContent(line);
                const quote = line.match(/^\s*>\s?(.*)$/);
                if (quote) {
                  // Only a quoted paragraph runs on into lines without a `>`; a quoted heading, rule or
                  // fence doesn't.
                  quoted =
                    Boolean(quote[1].trim()) && !rule.test(quote[1]) && !/^(#{1,6}\s|`{3,}(?=[^`]*$)|~{3,})/.test(quote[1]);
                  skip();
                  continue;
                }
                if (!line.trim() || rule.test(line) || /^\s*([-*+]\s|1[.)]\s|#{1,6}\s)/.test(line)) quoted = false;
                if (quoted) {
                  skip();
                } else {
                  // A list item starts a new block, so a code span can't run into it from the line above.
                  if (listItem.test(line)) skip();
                  proseLines.push({ line, section: current });
                }
              }

              // Words inside code, quotes and comments are someone else's: interface copy, commands, the
              // template's own instructions. A code span opens on a whole run of backticks and closes on a run
              // of the same length, so ``a `b` `` is one span and ``a` is no span at all. A span can wrap onto
              // the next line, as in a commit body wrapped at 72 columns, but not past a blank line.
              const strip = (lines) =>
                lines
                  .map(({ line }) => line)
                  .join('\n')
                  .replace(/(?<!`)(`+)(?!`)(?:[^\n]|\n(?![ \t]*\n))*?(?<!`)\1(?!`)/g, '')
                  .replace(/"[^"\n]*"|“[^”\n]*”/g, '')
                  .replace(/(^|[^*\w])\*(?!\*)[^*\n]+\*(?!\*)/g, '$1');
              const prose = strip(proseLines);
              const outsideVerify = isDescription
                ? strip(proseLines.filter(({ section }) => section !== 'How to verify'))
                : prose;

              if (isDescription) {
                for (const heading of ['Why', 'What changed', 'How to verify']) {
                  if (!(heading in sections)) findings.push(`no "## ${heading}" heading`);
                  else if (!sections[heading]) findings.push(`"## ${heading}" is empty`);
                }
              }

              // Narrow on purpose: each pattern is a reply to the requester or an account of the session,
              // never a description of what a user sees.
              const phrases = [
                { pattern: /\b(you|we)\s+(asked|chose|picked|wanted|preferred|approved|agreed|decided|requested|rejected)\b/i, reason: 'reports a decision as "you" or "we"' },
                { pattern: /\byour\s+(call|choice|decisions?|requests?|asks?|feedback|picks?)\b/i, reason: 'addresses the requester' },
                { pattern: /\bI(?:'ve)?\s+(took|ran|checked|chose|tried|kept|went|picked|decided|added|left|broke|put|corrected|confirmed|tested|verified|fixed|dropped|removed|changed|wrote|found|noticed|didn't|did not|deliberately)\b/, reason: 'narrates as "I"' },
                { pattern: /\bI'(ll|m|d)\b/, reason: 'narrates as "I"' },
                { pattern: /\bas (discussed|agreed|requested)\b/i, reason: 'refers to a conversation' },
                { pattern: /\bworth knowing\b/i, reason: 'has a "worth knowing" note' },
                { pattern: /\b(highest|best|lowest) so far\b/i, reason: 'reports a score from the run' },
                { pattern: /\bscored\s+(it\s+|the \w+\s+)?\d+\s*(\/|of|out of)\s*\d+/i, reason: 'reports a score from the run' },
                { pattern: /\(\d{1,2}\/(20|24|28|40)\)/, reason: 'reports a score from the run' },
                { pattern: /\bwe\s+(want|need|needed|took|ran|checked|tried|kept|went|mapped|found|noticed|didn't|did not)\b/i, reason: 'narrates as "we"' },
                { pattern: /\b(today's|yesterday's|this morning's|afternoon|evening|morning|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth) (critique|review)\b/i, reason: 'narrates the session' },
                { pattern: /\b(this|last|next|previous|another) round\b|\b(design|playtest) round\b/i, reason: 'narrates the session' },
                { pattern: /^\s*(?:[-*]\s+)?(?:\*\*)?(To do|Still to do|Still needed|Still to come|Not yet|Next steps?|Follow-ups?)\b[^\n]*:/m, reason: 'lists unfinished work' },
              ];
              for (const { pattern, reason } of phrases) {
                const match = prose.match(pattern);
                if (match) findings.push(`${reason}: "${match[0]}"`);
              }
              const openTask = prose
                .split('\n')
                .find((line) => /^\s*[-*] \[ \]/.test(line) && !/Merging with|label applied/.test(line));
              if (openTask) findings.push(`has an unfinished task: "${openTask.trim()}"`);
              if (isDescription && /\bstacked on #\d+|\bmerge (that|#\d+|it) first\b/i.test(outsideVerify)) {
                findings.push('has a merge-order note outside How to verify');
              }
              if (isDescription && /\bbefore merging\b/i.test(outsideVerify)) {
                findings.push('has a "before merging" note outside How to verify');
              }
              return findings;
            }

            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // Dependabot and GitHub's revert button write their own text.
            const generated = pr.user.login === 'dependabot[bot]' || /^revert-\d+-/.test(pr.head.ref);
            const findings = [];
            if (!generated) {
              for (const finding of reviewDescription(pr.body, { isDescription: true })) {
                findings.push(`Pull request description: ${finding}`);
              }
            }
            for (const commit of commits) {
              if (commit.author?.login === 'dependabot[bot]') continue;
              for (const finding of reviewDescription(commit.commit.message, { isDescription: false })) {
                findings.push(`Commit ${commit.sha.slice(0, 7)}: ${finding}`);
              }
            }

            if (findings.length) {
              core.setFailed(
                [
                  'The description or a commit message breaks the description rules:',
                  ...findings.map((finding) => `  - ${finding}`),
                  'Edit the description (the check re-runs on edit) or reword the commit, then push.',
                  'Rules: https://github.com/itriumid/agent-handbook/blob/main/conventions/rules/pull-requests.md#write-for-a-reader-who-wasnt-there',
                ].join('\n'),
              );
            } else {
              core.info(`Checked the description and ${commits.length} commit(s): written for a reader who wasn't there.`);
            }
